spring:
  application:
    name: turnos-api
  servlet:
    multipart:
      max-file-size: ${SPRING_MULTIPART_MAX_FILE_SIZE:5MB}
      max-request-size: ${SPRING_MULTIPART_MAX_REQUEST_SIZE:5MB}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/turnos_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      pool-name: TurnosHikariPool

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 10

  flyway:
    enabled: true
    locations: classpath:db/migration/global
    default-schema: public
    schemas: public
    create-schemas: true
    baseline-on-migrate: true
    validate-on-migrate: true
    ignore-migration-patterns: "*:missing"

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        debug: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION_MS:3600000}
  refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:7}

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

app:
  name: TuNegocio
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  backend-url: ${BACKEND_URL:http://localhost:8080}
  upload:
    max-image-size-bytes: ${APP_UPLOAD_MAX_IMAGE_SIZE_BYTES:5242880}
    max-product-images: ${APP_UPLOAD_MAX_PRODUCT_IMAGES:8}
  reminders:
    cron: ${REMINDERS_CRON:0 0 * * * *}
  tenancy:
    tenant-migration-location: classpath:db/migration/tenant
    migrate-legacy-public-data: ${MIGRATE_LEGACY_PUBLIC_DATA:true}
  payments:
    default-currency: ${APP_PAYMENTS_DEFAULT_CURRENCY:ARS}
    success-path: ${APP_PAYMENTS_SUCCESS_PATH:/pago/exito}
    failure-path: ${APP_PAYMENTS_FAILURE_PATH:/pago/error}
    pending-path: ${APP_PAYMENTS_PENDING_PATH:/pago/pendiente}

mercadopago:
  access-token: ${MERCADOPAGO_ACCESS_TOKEN:}
  webhook-secret: ${MERCADOPAGO_WEBHOOK_SECRET:}

stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
